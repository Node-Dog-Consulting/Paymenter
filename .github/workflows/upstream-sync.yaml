name: Upstream Release Sync

# Nightly check of the parent repo (Paymenter/Paymenter).
# When the parent publishes a release this fork doesn't have yet, this workflow:
#   1. pushes the release tag into this fork
#   2. recreates the GitHub Release here
#   3. opens a PR containing every commit from that release into the default branch
#
# Requires a repo/org secret SYNC_TOKEN: a PAT with `repo` + `workflow` scope
# (classic) or Contents:write + Pull-requests:write + Workflows:write (fine-grained).
# The default GITHUB_TOKEN cannot push refs that modify .github/workflows/*, which
# upstream release commits routinely do.

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC nightly
  workflow_dispatch:
    inputs:
      upstream:
        description: "Upstream repo (owner/name)"
        required: false
        default: "Paymenter/Paymenter"

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: ${{ github.event.inputs.upstream || 'Paymenter/Paymenter' }}
  GH_TOKEN: ${{ secrets.SYNC_TOKEN }}

jobs:
  sync:
    name: Check upstream releases
    runs-on: ubuntu-24.04
    steps:
      - name: Verify SYNC_TOKEN is configured
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::SYNC_TOKEN secret is not set. Create a PAT with repo+workflow scope and add it as the SYNC_TOKEN secret."
            exit 1
          fi

      - name: Checkout fork (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --tags --prune

      - name: Find the latest upstream release missing from this fork
        id: check
        run: |
          set -euo pipefail

          # Upstream releases, newest first (skip drafts).
          mapfile -t TAGS < <(gh release list --repo "${UPSTREAM}" --limit 30 \
            --exclude-drafts --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName')

          NEW_TAG=""
          for tag in "${TAGS[@]}"; do
            if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              # Reached a release we already have — everything newer is handled above it.
              break
            fi
            NEW_TAG="$tag"
          done

          if [ -z "$NEW_TAG" ]; then
            echo "No new upstream release. Nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream release: $NEW_TAG"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Push release tag into fork
        if: steps.check.outputs.found == 'true'
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          git push origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Recreate the GitHub Release
        if: steps.check.outputs.found == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.tag }}"
          meta="$(gh release view "$TAG" --repo "${UPSTREAM}" \
            --json name,body,isPrerelease)"
          name="$(echo "$meta" | jq -r '.name // ""')"
          body="$(echo "$meta" | jq -r '.body // ""')"
          pre="$(echo "$meta" | jq -r 'if .isPrerelease then "--prerelease" else "" end')"

          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --title "${name:-$TAG}" \
            --notes "${body:-_Mirrored from ${UPSTREAM}@${TAG}_}" \
            $pre

      - name: Open PR with all commits from the release
        if: steps.check.outputs.found == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.tag }}"
          BASE="${{ github.event.repository.default_branch }}"
          BRANCH="upstream-sync/${TAG}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists — PR was created on a previous run."
            exit 0
          fi

          # Branch pointing at the exact upstream release commit.
          git branch -f "$BRANCH" "${TAG}"
          git push origin "$BRANCH"

          AHEAD="$(git rev-list --count "origin/${BASE}..${TAG}")"
          BEHIND="$(git rev-list --count "${TAG}..origin/${BASE}")"

          gh pr create --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE}" --head "${BRANCH}" \
            --title "chore: sync upstream release ${TAG}" \
            --body "Upstream [\`${UPSTREAM}\`](https://github.com/${UPSTREAM}) published **${TAG}**.

          This branch points at that release commit. Merging brings in **${AHEAD}** upstream
          commit(s); \`${BASE}\` currently has **${BEHIND}** commit(s) not in the release
          (your fork's customisations). Expect to resolve conflicts on merge.

          Release notes + tag have been mirrored into this repo automatically.

          _Compare: https://github.com/${UPSTREAM}/releases/tag/${TAG}_"
